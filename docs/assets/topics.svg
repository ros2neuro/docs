<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ROS2neuro topics</title>
  <desc id="d">The nodes of the chain with the topic and the message type that connects each pair, the events sent to the recorder and the reset service.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <style>
      .box { stroke-width: 1.8; rx: 9; }
      .proc { fill: #dbe7fb; stroke: #3b5ba9; }
      .dec  { fill: #dff3e3; stroke: #2f7d45; }
      .prot { fill: #fde8cf; stroke: #b9741d; }
      .side { fill: #eceff3; stroke: #667085; }
      .name { font-size: 18px; font-weight: 700; fill: #1b2330; text-anchor: middle; }
      .node { font-size: 13px; fill: #3b4658; text-anchor: middle; font-family: "Courier New", monospace; }
      .topic { font-size: 15px; font-weight: 700; fill: #1b2330; font-family: "Courier New", monospace; }
      .type  { font-size: 14px; fill: #2c4a8a; font-family: "Courier New", monospace; }
      .note  { font-size: 14px; fill: #3b4658; }
      .line { stroke: #4a5568; stroke-width: 2; fill: none; }
      .dash { stroke: #4a5568; stroke-width: 1.8; fill: none; stroke-dasharray: 7 5; }
      .title { font-size: 22px; font-weight: 700; fill: #1b2330; }
    </style>
  </defs>
  <rect width="800" height="1050" fill="#ffffff"/>
  <text class="title" x="30" y="30">Topics and message types</text>
  <rect class="box proc" x="60" y="40" width="230" height="64"/>
  <text class="name" x="175" y="68">Acquisition</text>
  <text class="node" x="175" y="88">node: acq</text>
  <rect class="box proc" x="60" y="184" width="230" height="64"/>
  <text class="name" x="175" y="212">Filters</text>
  <text class="node" x="175" y="232">node: filters</text>
  <rect class="box proc" x="60" y="328" width="230" height="64"/>
  <text class="name" x="175" y="356">Processing</text>
  <text class="node" x="175" y="376">node: welch or buffer</text>
  <rect class="box dec" x="60" y="472" width="230" height="64"/>
  <text class="name" x="175" y="500">Decoder</text>
  <text class="node" x="175" y="520">node: decoder</text>
  <rect class="box dec" x="60" y="616" width="230" height="64"/>
  <text class="name" x="175" y="644">Integrator</text>
  <text class="node" x="175" y="664">node: integrator</text>
  <rect class="box prot" x="60" y="760" width="230" height="64"/>
  <text class="name" x="175" y="788">Manager</text>
  <text class="node" x="175" y="808">node: manager</text>
  <rect class="box prot" x="60" y="904" width="230" height="64"/>
  <text class="name" x="175" y="932">Feedback</text>
  <text class="node" x="175" y="952">node: feedback</text>
  <path class="line" d="M175,104 V182" marker-end="url(#arrow)"/>
  <text class="topic" x="191" y="142">/acquisition/neurodata</text>
  <text class="type" x="191" y="161">NeuroFrame</text>
  <path class="line" d="M175,248 V326" marker-end="url(#arrow)"/>
  <text class="topic" x="191" y="286">/processing/filtered</text>
  <text class="type" x="191" y="305">NeuroFrame</text>
  <path class="line" d="M175,392 V470" marker-end="url(#arrow)"/>
  <text class="topic" x="191" y="420">/processing/psd</text>
  <text class="topic" x="191" y="438">or /processing/buffered_features</text>
  <text class="type" x="191" y="457">NeuroFeature: PSD or window</text>
  <path class="line" d="M175,536 V614" marker-end="url(#arrow)"/>
  <text class="topic" x="191" y="574">/classification/prediction</text>
  <text class="type" x="191" y="593">NeuroPrediction</text>
  <path class="line" d="M175,680 V758" marker-end="url(#arrow)"/>
  <text class="topic" x="191" y="718">/integrated/raw</text>
  <text class="type" x="191" y="737">NeuroControl</text>
  <path class="line" d="M175,824 V902" marker-end="url(#arrow)"/>
  <text class="topic" x="191" y="862">/manager_control/probabilities</text>
  <text class="type" x="191" y="881">NeuroControl</text>
  <rect class="box side" x="545" y="184" width="230" height="64"/>
  <text class="name" x="660" y="212">Visualizer</text>
  <text class="node" x="660" y="232">node: neuroviz</text>
  <rect class="box side" x="545" y="760" width="230" height="64"/>
  <text class="name" x="660" y="788">Recorder</text>
  <text class="node" x="660" y="808">node: recorder</text>
  <path class="line" d="M290,72 H510 V774 H543" marker-end="url(#arrow)"/>
  <path class="line" d="M510,216 H543" marker-end="url(#arrow)"/>
  <text class="topic" x="524" y="342">/acquisition/neurodata</text>
  <text class="topic" x="524" y="364">/acquisition/neurodata_info</text>
  <text class="type" x="524" y="386">NeuroFrame, NeuroFrameInfo</text>
  <text class="note" x="524" y="412">(the visualizer reads the first one)</text>
  <path class="line" d="M290,806 H543" marker-end="url(#arrow)"/>
  <text class="topic" x="304" y="798">/neuroevent</text>
  <text class="type" x="304" y="822">NeuroEvent</text>
  <path class="dash" d="M290,772 H430 V638 H292" marker-end="url(#arrow)"/>
  <text class="topic" x="304" y="660">/reset</text>
  <text class="type" x="304" y="678">service</text>
  <text class="note" x="30" y="1010">Dashed line: a service call, not a topic. Processing is the Welch node (classic decoders) or the buffer node (deep learning).</text>
  <text class="note" x="30" y="1030">Topic names are those of the ros2neuro_devel_test launchers: the defaults of each node are in the table below.</text>
</svg>
