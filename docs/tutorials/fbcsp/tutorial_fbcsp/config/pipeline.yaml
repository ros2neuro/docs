# The two nodes of the FBCSP pipeline that are not the fbcsp node (that one is configured by fbcsp.yaml, written by train_fbcsp.m).
# The launcher fills in the substitutions (the GDF to replay and the manifest of the decoder).

/acquisition:
    ros__parameters:
        acquisition.plugin: ros2neuro::acquisition::XDFDevice
        acquisition.autostart: true
        acquisition.reopen: true
        acquisition.filename: "$(var gdf_file)"
        acquisition.framerate: 16.0
        acquisition.loop: true

/decoder:
    ros__parameters:
        decoder.manifest_path: "$(var decoder_manifest)"
