<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ROS2neuro feedback in WebXR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Versions are pinned on purpose: a page that works today keeps working. -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/roslib@1.4.1/build/roslib.min.js"></script>
</head>
<body>
  <!--
    A passive VR feedback for ROS2neuro.

    It hears two things through rosbridge, as ros2neuro_feedback does:

      the flow of control_feedback, /control_feedback/probabilities (ros2neuro_msgs/msg/NeuroControl):
        fields / values   the class codes ("773", "771") and their normalized values      -> height of every bar
                          then "threshold:773", "threshold:771" and the thresholds in force  -> the white line of every bar
      the event bus, /neuroevent (ros2neuro_msgs/msg/NeuroEvent), where the manager and control write the trial:
        786 fixation, the cue (the class code), and their "Off" (+32768)
        897 Hit, 898 Miss, 899 Timeout                                                    -> the "boom"

    The thresholds move when they are changed while running (ros2 param set /control thresholds "[0.8, 0.8]"). The query
    parameter "thresholds" is only the value the lines have until the flow brings the real ones.

    Query parameters (all optional):
      ?host=localhost  &port=9090  &topic=/control_feedback/probabilities  &events=/neuroevent  &thresholds=0.7,0.7
  -->
  <a-scene background="color: #05070d" renderer="colorManagement: true" vr-mode-ui="enabled: true">
    <a-entity id="rig" position="0 0 0">
      <a-entity camera look-controls wasd-controls position="0 1.6 0">
        <!-- status line fixed in front of the eyes -->
        <a-text id="status" value="connecting..." position="0 0.62 -1.2" width="1.3" align="center" color="#9aa4b2"></a-text>
      </a-entity>
    </a-entity>

    <a-plane rotation="-90 0 0" width="12" height="12" color="#0d1220"></a-plane>
    <a-entity light="type: ambient; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="1 3 2"></a-entity>

    <!-- everything the feedback draws is created inside this entity -->
    <a-entity id="feedback" position="0 0 -2.4"></a-entity>
  </a-scene>

  <script>
    // --8<-- [start:settings]
    // ------------------------------------------------------------------ settings
    const params = new URLSearchParams(location.search);
    const HOST = params.get('host') || 'localhost';
    const PORT = params.get('port') || '9090';
    const TOPIC = params.get('topic') || '/control_feedback/probabilities';
    const EVENTS = params.get('events') || '/neuroevent';
    const THRESHOLDS = (params.get('thresholds') || '').split(',').map(Number).filter(v => !isNaN(v) && v > 0);   // until the flow brings them

    const EVENT = { FIXATION: 786, HIT: 897, MISS: 898, TIMEOUT: 899, OFF: 32768, SHOWN: 16384 };
    const REST = 783;
    // a class is colored by its POSITION, never by its code (the rest is the only exception: yellow)
    const COLORS = ['#4169e1', '#b22222', '#228b22', '#9370db', '#ff1493', '#008b8b', '#8b4513'];
    const REST_COLOR = '#ffd400';

    const BAR_HEIGHT = 1.5;     // meters for a value of 1
    const BAR_WIDTH = 0.35;
    const BAR_GAP = 0.25;
    // --8<-- [end:settings]

    // --8<-- [start:scene]
    // ------------------------------------------------------------------ the scene
    const root = document.querySelector('#feedback');
    const statusText = document.querySelector('#status');
    let bars = [];              // { field, el, x, base, line }
    let cross = null, cue = null, outcomeText = null;
    let target = null;          // class code of the current cue

    function el(tag, attrs, parent) {
      const e = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
      (parent || root).appendChild(e);
      return e;
    }
    // --8<-- [end:scene]

    function color(field, index) {
      return Number(field) === REST ? REST_COLOR : COLORS[index % COLORS.length];
    }

    // --8<-- [start:bars]
    // One bar per field of the first message. Built once.
    function build(fields) {
      const n = fields.length;
      const span = n * BAR_WIDTH + (n - 1) * BAR_GAP;
      fields.forEach((field, i) => {
        const x = -span / 2 + BAR_WIDTH / 2 + i * (BAR_WIDTH + BAR_GAP);
        const c = color(field, i);
        // the frame of the bar: a thin transparent box, one unit tall
        el('a-box', { position: `${x} ${BAR_HEIGHT / 2} 0`, width: BAR_WIDTH, height: BAR_HEIGHT, depth: 0.12,
                      material: 'color: #ffffff; opacity: 0.08; transparent: true' });
        // the bar itself: its height is set at every message
        const bar = el('a-box', { position: `${x} 0 0`, width: BAR_WIDTH * 0.9, height: 0.01, depth: 0.1,
                                  material: `color: ${c}` });
        // the threshold line, in white
        const line = el('a-box', { position: `${x} 0 0.07`, width: BAR_WIDTH * 1.25, height: 0.02, depth: 0.02,
                                   material: 'color: #ffffff', visible: false });
        bars.push({ field, el: bar, x, base: c, line, threshold: THRESHOLDS[i] });
      });
      // fixation cross, cue and outcome text, above the bars (hidden until the manager asks)
      const top = BAR_HEIGHT + 0.35;
      cross = el('a-text', { value: '+', align: 'center', color: '#ffffff', width: 6, position: `0 ${top} 0`, visible: false });
      cue = el('a-sphere', { radius: 0.12, position: `0 ${top} 0`, visible: false });
      outcomeText = el('a-text', { value: '', align: 'center', color: '#ffffff', width: 3.2, position: `0 ${top + 0.45} 0` });
    }

    function setHeight(bar, value) {
      const h = Math.max(0.01, Math.min(1, value)) * BAR_HEIGHT;
      bar.el.setAttribute('height', h);
      bar.el.setAttribute('position', `${bar.x} ${h / 2} 0`);   // a bar grows upwards from the floor
    }
    // --8<-- [end:bars]

    // --8<-- [start:flow]
    // ------------------------------------------------------------------ the flow of control_feedback
    // fields = the K class codes, then "threshold:<code>" for each; values = the K values, then the thresholds in force
    function onFlow(msg) {
      const fields = msg.fields || [];
      const values = msg.values || [];
      const classes = [], thresholds = {};
      fields.forEach((f, i) => {
        if (f.startsWith('threshold:')) thresholds[f.slice('threshold:'.length)] = values[i];
        else classes.push({ field: f, value: values[i] });
      });
      if (!bars.length && classes.length) build(classes.map(c => c.field));

      // the height of every bar; the white line follows the threshold in force; a bar at or above it is white
      bars.forEach(bar => {
        const c = classes.find(x => x.field === bar.field);
        const v = c ? c.value : 0;
        if (thresholds[bar.field] !== undefined) bar.threshold = thresholds[bar.field];
        if (bar.threshold) {
          bar.line.setAttribute('position', `${bar.x} ${bar.threshold * BAR_HEIGHT} 0.07`);
          bar.line.setAttribute('visible', true);
        }
        setHeight(bar, v);
        bar.el.setAttribute('material', 'color', bar.threshold && v >= bar.threshold ? '#ffffff' : bar.base);
      });
    }
    // --8<-- [end:flow]

    // --8<-- [start:events]
    // ------------------------------------------------------------------ the event bus: the phases of the trial
    // Events and values travel on different topics: the order between them is not guaranteed, and it does not matter here.
    function onEvent(msg) {
      const e = msg.event_id;
      const off = id => e - EVENT.OFF === id;
      if (e === EVENT.HIT || e === EVENT.MISS || e === EVENT.TIMEOUT) {          // the outcome, written by control
        const word = { [EVENT.HIT]: 'Hit', [EVENT.MISS]: 'Miss', [EVENT.TIMEOUT]: 'Timeout' }[e];
        outcomeText.setAttribute('value', word);
        outcomeText.setAttribute('color', e === EVENT.HIT ? '#7CFC00' : e === EVENT.MISS ? '#ff6b6b' : '#cccccc');
      } else if (off(EVENT.HIT) || off(EVENT.MISS) || off(EVENT.TIMEOUT)) {      // the end of the outcome, written by the manager
        outcomeText.setAttribute('value', '');
        target = null;
      } else if (e === EVENT.FIXATION) {
        cross.setAttribute('visible', true);
      } else if (off(EVENT.FIXATION)) {
        cross.setAttribute('visible', false);
      } else if (e >= EVENT.SHOWN && e < EVENT.OFF) {
        // an event of the kind "this was shown" (id + 16384), published by a feedback: not a phase
      } else if (e >= EVENT.OFF) {
        cue.setAttribute('visible', false);                                       // the end of the cue (class code + Off); the end of
                                                                                  // Start and CFeedback come here too and change nothing
      } else if (bars.some(b => Number(b.field) === e) || e === REST) {
        target = e;                                                               // the cue: a sphere with the color of the target
        const i = bars.findIndex(b => Number(b.field) === e);
        cue.setAttribute('material', 'color', e === REST || i < 0 ? REST_COLOR : bars[i].base);
        cue.setAttribute('visible', true);
      }
    }
    // --8<-- [end:events]

    // --8<-- [start:connect]
    // ------------------------------------------------------------------ rosbridge
    function connect() {
      const url = `ws://${HOST}:${PORT}`;
      statusText.setAttribute('value', `connecting to ${url} ...`);
      const ros = new ROSLIB.Ros({ url });

      ros.on('connection', () => {
        statusText.setAttribute('value', `connected: ${TOPIC}`);
        // No throttle_rate on the events: a throttle would drop the second of two events sent in the same instant
        // (the end of the fixation and the cue). The flow is light, a few tens of messages per second.
        new ROSLIB.Topic({
          ros, name: TOPIC, messageType: 'ros2neuro_msgs/msg/NeuroControl'
        }).subscribe(onFlow);
        new ROSLIB.Topic({
          ros, name: EVENTS, messageType: 'ros2neuro_msgs/msg/NeuroEvent'
        }).subscribe(onEvent);
      });
      ros.on('error', () => statusText.setAttribute('value', `cannot reach ${url}`));
      ros.on('close', () => {
        statusText.setAttribute('value', `disconnected, retrying ...`);
        setTimeout(connect, 2000);
      });
    }
    connect();
    // --8<-- [end:connect]
  </script>
</body>
</html>
