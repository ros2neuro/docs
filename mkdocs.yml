site_name: ROS2neuro
site_description: Documentation of ROS2neuro, a modular ROS 2 framework for neurophysiological signal acquisition, processing, decoding and closed-loop BCI.
site_url: https://ros2neuro.github.io/docs/
repo_url: https://github.com/ros2neuro/docs

# Tutorial packages and client code live next to their page in docs/tutorials/<name>/: keep their sources out of the site
exclude_docs: |
  /tutorials/*/tutorial_*/
  /tutorials/visualizer/*.yaml
  /tutorials/vr-feedback/webxr/
  /tutorials/vr-feedback/unity/

# a broken #anchor in a link is reported (and stops `mkdocs build --strict`)
validation:
  anchors: warn

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  logo: assets/logo-icon.png
  favicon: assets/favicon-v3.png
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - docs/tutorials
        - docs/reproducibility
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Concepts:
      - concepts/architecture.md
      - concepts/messages.md
      - concepts/topics.md
      - concepts/shared-parameters.md
      - concepts/plugins.md
      - concepts/protocols.md
  - Packages:
      - packages/index.md
      - packages/msgs-data.md
      - Acquisition:
          - packages/acquisition/index.md
          - packages/acquisition/dummy.md
          - packages/acquisition/lsl.md
          - packages/acquisition/eegdev.md
          - packages/acquisition/antneuro.md
          - packages/acquisition/gusbamp.md
          - packages/acquisition/xdf.md
      - Filters:
          - packages/filters/index.md
          - packages/filters/dc.md
          - packages/filters/butterworth.md
          - packages/filters/car.md
          - packages/filters/laplacian.md
          - packages/filters/hann.md
          - packages/filters/hamming.md
          - packages/filters/blackman.md
          - packages/filters/flattop.md
      - Processing:
          - packages/processing/index.md
          - packages/processing/spectral.md
          - packages/processing/buffer.md
          - packages/processing/fbcsp.md
      - Decoder:
          - packages/decoder/index.md
          - packages/decoder/lda.md
          - packages/decoder/qda.md
          - packages/decoder/svm.md
          - packages/decoder/gaussian.md
          - packages/decoder/sklearn.md
          - packages/decoder/braindecode.md
          - packages/decoder/converters.md
      - Integrator:
          - packages/integrator/index.md
          - packages/integrator/exponential.md
          - packages/integrator/buffer.md
      - Recorder:
          - packages/recorder/index.md
          - packages/recorder/xdf.md
      - Control:
          - packages/control/index.md
          - packages/control/feedback.md
      - Manager:
          - packages/manager/index.md
          - packages/manager/synchronous.md
          - packages/manager/asynchronous.md
      - Feedback:
          - packages/feedback/index.md
          - packages/feedback/neurodraw.md
          - packages/feedback/wheel.md
          - packages/feedback/bar.md
      - packages/visualizer.md
      - packages/devel-test.md
  - Tutorials:
      - tutorials/index.md
      - Start here:
          - "1. ROS 2 essentials: nodes, topics and launch files": tutorials/ros2-basics/index.md
          - "2. Your first publisher and subscriber": tutorials/publisher-subscriber/index.md
          - "3. Acquire, view and record the EEG": tutorials/acquisition-recording/index.md
          - "4. View the signals in the visualizer": tutorials/visualizer/index.md
          - "5. Build a filter chain": tutorials/filter-chain/index.md
          - "6. Run several filter chains in parallel": tutorials/multiple-chains/index.md
          - "7. Build the whole pipeline step by step": tutorials/full-pipeline/index.md
          - "8. Run the complete pipeline without hardware": tutorials/hardware-free-pipeline/index.md
      - Your first BCI programs:
          - "9. Compute the band power of a channel": tutorials/band-power/index.md
          - "10. A feedback window that follows the band power": tutorials/feedback-gui/index.md
      - Extending the stack:
          - "11. Write a filter plugin": tutorials/filter-plugin/index.md
          - "12. Write an integrator plugin": tutorials/integrator-plugin/index.md
          - "13. Detect a power threshold and publish an event": tutorials/power-threshold-event/index.md
